# Full stack with defaults — no repo .env files required for a local bring-up.
# First boot runs DB bootstrap plus on-chain CoinMetrics backfill (empty DB); the API stays
# down until that finishes — with defaults (top ~150 markets, ALL metrics, multi-year)
# this can take many hours; backend health uses a long start_period. Subsequent boots skip
# backfill once on_chain_metrics is populated.
# Open http://localhost:8080 when frontend and gateway report healthy.
# Backend image includes repo ``scrapers/`` and ``uv``; override with ``./scrapers:/scrapers`` if needed.

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: tauron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tauron
    ports:
      - "5433:5432"
    volumes:
      - tauron_pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tauron"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tauron-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      SCRAPERS_DIR: /scrapers
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tauron
      POSTGRES_SSL: "false"
      JWT_SECRET: docker-compose-development-only-change-for-production-use-long-random
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      CORS_ALLOW_CREDENTIALS: "true"
      BOOTSTRAP_DATABASE_ON_STARTUP: "true"
      AUTO_POPULATE_ONCHAIN_ON_EMPTY_DB: "true"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 24
      start_period: 28800s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tauron-frontend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_ORIGIN: http://backend:8000
      API_INTERNAL_BASE_URL: http://backend:8000/api/v1
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s

  gateway:
    image: nginx:alpine
    container_name: tauron-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  tauron_pgdata:
