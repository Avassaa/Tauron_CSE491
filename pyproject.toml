[project]
name = "tauron-ai-engine"
version = "1.0.0"
description = "Training and inference service for Tauron ML models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104,<0.116",
    "uvicorn[standard]>=0.24,<0.35",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
    "httpx>=0.25,<0.29",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "lightgbm>=4.0,<5",
    "xgboost>=2.1,<3",
    "torch>=2.2,<3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.8,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
